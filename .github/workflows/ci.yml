name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUSTFLAGS: -Dwarnings

jobs:
  build_and_test:
    name: Build and test (${{ matrix.rust }}, ${{ matrix.feature_args || 'default' }})
    runs-on: ${{ matrix.os }}
    # Only stable gates merges and releases; beta/nightly are advisory, so
    # upstream toolchain churn cannot block a dependency bump or a release.
    continue-on-error: ${{ matrix.rust != 'stable' }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        rust: [stable]
        feature_args:
          - "--no-default-features"
          - "--no-default-features --features alloc"
          - "--no-default-features --features time"
          - "--no-default-features --features chrono"
          - "--no-default-features --features jiff"
          - "--no-default-features --features parquet"
          - ""
        include:
          - os: ubuntu-latest
            rust: beta
            feature_args: ""
          - os: ubuntu-latest
            rust: nightly
            feature_args: ""

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-all-crates: true

      - run: cargo fetch
      - run: cargo check ${{ matrix.feature_args }}
      - run: cargo test ${{ matrix.feature_args }}
      - run: cargo bench ${{ matrix.feature_args }}

  check_fmt_and_docs:
    name: Checking fmt, clippy, and docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-all-crates: true

      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --check
      - run: cargo doc --workspace --no-deps

  check_invalid_features:
    name: Check invalid feature pairs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-all-crates: true

      - run: just feature-check-invalid
