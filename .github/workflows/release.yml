name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag must describe a version we can actually publish.
  verify:
    name: Verify tag and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-all-crates: true

      - name: Resolve crate metadata and check it against the tag
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')"
          manifest="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"

          if [ "$version" != "$manifest" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies version ${version}, but Cargo.toml says ${manifest}"
            exit 1
          fi

          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check the version is not on crates.io yet
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Sparse index layout for crate names of four characters or more.
          url="https://index.crates.io/${NAME:0:2}/${NAME:2:2}/${NAME}"
          index="${RUNNER_TEMP}/index.json"
          code="$(curl -sS -o "$index" -w '%{http_code}' "$url")"

          case "$code" in
            404) echo "${NAME} is not on the index yet, nothing to compare against"; exit 0 ;;
            200) ;;
            *) echo "::error::unexpected status ${code} from ${url}"; exit 1 ;;
          esac

          if jq -e --arg v "$VERSION" 'select(.vers == $v)' "$index" > /dev/null; then
            echo "::error::${NAME} ${VERSION} is already published on crates.io"
            exit 1
          fi

      - name: Package crate
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cargo package --locked --all-features
          cd target/package
          sha256sum "${NAME}-${VERSION}.crate" > "${NAME}-${VERSION}.crate.sha256"

      - name: Upload packaged crate
        uses: actions/upload-artifact@v7.0.1
        with:
          name: crate
          path: |
            target/package/*.crate
            target/package/*.crate.sha256
          if-no-files-found: error

  # The tagged commit must already be green on main.
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - name: Wait for the Continuous Integration workflow to succeed
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const WORKFLOW = 'Continuous Integration';
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            // The CI workflow only runs on pushes to main, so it may not have
            // been registered yet when the tag arrives alongside the branch.
            let run;
            for (let attempt = 0; attempt < 30 && !run; attempt++) {
              if (attempt > 0) await sleep(10000);
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event: 'push',
                head_sha: context.sha,
              });
              run = runs.data.workflow_runs.find(r => r.name === WORKFLOW);
            }

            if (!run) {
              throw new Error(
                `no '${WORKFLOW}' run found for ${context.sha}; push the commit to main before tagging it`
              );
            }

            let { status, conclusion } = run;
            while (status !== 'completed') {
              await sleep(10000);
              const current = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              status = current.data.status;
              conclusion = current.data.conclusion;
            }

            if (conclusion !== 'success') {
              throw new Error(`'${WORKFLOW}' finished with conclusion: ${conclusion}`);
            }

  release:
    name: GitHub release
    needs: [verify, wait-for-ci]
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    steps:
      - name: Download packaged crate
        uses: actions/download-artifact@v8.0.1
        with:
          name: crate
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    environment: crates.io
    concurrency: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
