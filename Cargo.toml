[package]
name = "cloudfront-logs"
description = "AWS CloudFront log line parser"
version = "0.10.1"
edition = "2024"
repository = "https://github.com/asaaki/cloudfront-logs"
categories = [
  "parser-implementations",
  "data-structures",
  "encoding",
  "rust-patterns",
  "value-formatting",
]
keywords = ["cloudfront", "log", "parser", "aws", "parquet"]
license = "MIT OR Apache-2.0"
exclude = [".assets/*", ".github/*"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.docs.rs]
features = ["jiff"]
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "brwv"
path = "benches/borrowed-real-world-validated.rs"
harness = false

[[bench]]
name = "brwu"
path = "benches/borrowed-real-world-unvalidated.rs"
harness = false

[features]
default = ["alloc", "jiff"]

# when you need owned versions of the structured log data; enabled by default
alloc = []

# use typed variants with time's date and time types
time = ["alloc", "dep:time"]
# use typed variants with chrono's date and time types
chrono = ["alloc", "dep:chrono"]
# use typed variants with jiff's civil date and time types
jiff = ["alloc", "dep:jiff"]

# provides parquet (record writer) support
parquet = ["alloc", "dep:parquet", "dep:parquet_derive", "dep:chrono"]

[dependencies]
memchr = "2.8.3"
time = { version = "0.3.55", features = ["parsing", "macros"], optional = true }
strum = { version = "0.28.0", features = ["derive"] }
chrono = { version = "0.4.45", optional = true }
jiff = { version = "0.2.35", optional = true }
parquet = { version = "59.3.0", optional = true }
parquet_derive = { version = "59.3.0", optional = true }
self_cell = "1.3.0"

[dev-dependencies]
divan = "0.1.21"
trybuild = "1.0.121"
